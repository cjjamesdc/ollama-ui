<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Interface</title>
    <style>
        :root {
            /* Dark Theme - Claude Style */
            --bg-primary: #1a1a1a;
            --bg-secondary: #2a2a2a;
            --bg-user: #2d2d2d;
            --bg-assistant: #1f1f1f;
            --text-primary: #e8e8e8;
            --text-secondary: #a8a8a8;
            --accent-primary: #cc9b7a;
            --accent-secondary: #d4a574;
            --border-color: #3a3a3a;
            --shadow: rgba(0, 0, 0, 0.2);
        }

        [data-theme="light"] {
            /* Light Theme - Claude Style */
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-user: #f7f7f7;
            --bg-assistant: #ffffff;
            --text-primary: #2c2c2c;
            --text-secondary: #666666;
            --accent-primary: #cc9b7a;
            --accent-secondary: #b8865d;
            --border-color: #e5e5e5;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
        }

        html {
            font-size: 15px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100%;
            margin: 0 auto;
        }

        #header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-primary);
            flex-shrink: 0;
        }

        #header h1 {
            margin: 0;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        #theme-toggle {
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.875rem;
            color: var(--text-primary);
            font-weight: 500;
            transition: all 0.15s ease;
        }

        #theme-toggle:hover {
            background-color: var(--bg-secondary);
            border-color: var(--accent-primary);
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            background-color: var(--bg-primary);
        }

        #chat-window::-webkit-scrollbar {
            width: 8px;
        }

        #chat-window::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat-window::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        #chat-window::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        .message {
            padding: 24px;
            width: 100%;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 1rem;
            animation: fadeIn 0.2s ease;
            border-bottom: 1px solid var(--border-color);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-content {
            max-width: 48rem;
            margin: 0 auto;
            font-family: ui-monospace, 'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace;
        }

        .user-message {
            background-color: var(--bg-user);
            color: var(--text-primary);
        }

        .user-message .message-content {
            color: var(--text-primary);
        }

        .assistant-message {
            background-color: var(--bg-assistant);
            color: var(--text-primary);
        }

        .assistant-message .message-content {
            color: var(--text-primary);
        }

        #controls {
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        #status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        #model-selector {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        #model-selector:hover {
            border-color: var(--accent-primary);
        }

        #model-selector:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(204, 155, 122, 0.15);
        }

        #status {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            text-align: right;
            font-family: ui-monospace, monospace;
        }

        #input-area {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #prompt-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.15s ease;
            resize: none;
            line-height: 1.5;
        }

        #prompt-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(204, 155, 122, 0.15);
        }

        #prompt-input::placeholder {
            color: var(--text-secondary);
        }

        #send-button {
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            background-color: var(--accent-primary);
            color: #1a1a1a;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9375rem;
            font-weight: 600;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        #send-button:hover:not(:disabled) {
            background-color: var(--accent-secondary);
        }

        #send-button:active:not(:disabled) {
            transform: scale(0.98);
        }

        #send-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            #header {
                padding: 12px 16px;
            }

            .message {
                padding: 20px 16px;
            }

            #controls {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="header">
        <h1>Chat Interface</h1>
        <button id="theme-toggle">Light Mode</button>
    </div>
    <div id="chat-window"></div>
    <div id="controls">
        <div id="status-bar">
            <select id="model-selector"></select>
            <div id="status">Select a model to begin.</div>
        </div>
        <div id="input-area">
            <input type="text" id="prompt-input" placeholder="Type your message...">
            <button id="send-button">Send</button>
        </div>
    </div>
</div>

<script>
    const sendButton = document.getElementById('send-button');
    const promptInput = document.getElementById('prompt-input');
    const chatWindow = document.getElementById('chat-window');
    const statusDiv = document.getElementById('status');
    const modelSelector = document.getElementById('model-selector');
    const themeToggle = document.getElementById('theme-toggle');

    const OLLAMA_API_URL = 'http://localhost:11434';
    let conversationHistory = [];

    // --- Theme Toggle Functionality ---
    let currentTheme = localStorage.getItem('theme') || 'dark';

    function setTheme(theme) {
        if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            themeToggle.textContent = 'Dark Mode';
        } else {
            document.documentElement.removeAttribute('data-theme');
            themeToggle.textContent = 'Light Mode';
        }
        localStorage.setItem('theme', theme);
        currentTheme = theme;
    }

    themeToggle.addEventListener('click', () => {
        setTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    // Initialize theme on load
    setTheme(currentTheme);

    // --- 1. Fetch and Populate Models on Load ---
    async function populateModels() {
        try {
            const response = await fetch(`${OLLAMA_API_URL}/api/tags`);
            const data = await response.json();
            data.models.forEach(model => {
                const option = document.createElement('option');
                option.value = model.name;
                option.textContent = model.name;
                modelSelector.appendChild(option);
            });
            statusDiv.textContent = 'Ready.';
        } catch (error) {
            console.error('Error fetching models:', error);
            statusDiv.textContent = 'Error: Could not connect to Ollama. Make sure it is running.';
        }
    }

    // --- 2. Main Function to Handle Chat ---
    async function handleChat() {
        const prompt = promptInput.value.trim();
        if (!prompt) return;

        const selectedModel = modelSelector.value;
        if (!selectedModel) {
            statusDiv.textContent = 'Please select a model first.';
            return;
        }

        conversationHistory.push({ role: 'user', content: prompt });
        addMessageToChat(prompt, 'user-message');
        promptInput.value = '';
        statusDiv.textContent = 'Model is thinking...';
        sendButton.disabled = true;

        try {
            const response = await fetch(`${OLLAMA_API_URL}/api/chat`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    model: selectedModel,
                    messages: conversationHistory,
                    stream: false
                }),
            });

            if (!response.ok) {
                throw new Error(`API request failed with status ${response.status}`);
            }

            const data = await response.json();
            conversationHistory.push(data.message);
            addMessageToChat(data.message.content, 'assistant-message');

            // --- 3. Updated Token Information Display ---
            const promptTokens = data.prompt_eval_count;
            const responseTokens = data.eval_count;
            const evalDurationInSeconds = data.eval_duration / 1e9; // Convert nanoseconds to seconds
            const tokensPerSecond = (evalDurationInSeconds > 0) ? (responseTokens / evalDurationInSeconds).toFixed(2) : 0;

            statusDiv.textContent = `Ready | Prompt: ${promptTokens} | Response: ${responseTokens} | Speed: ${tokensPerSecond} tok/s`;

        } catch (error) {
            console.error('Error during chat:', error);
            statusDiv.textContent = 'Error communicating with Ollama API.';
            addMessageToChat('Sorry, there was an error. Make sure Ollama is running and accessible.', 'assistant-message');
        } finally {
            sendButton.disabled = false;
            promptInput.focus();
        }
    }

    // --- Helper function to add messages to the UI ---
    function addMessageToChat(text, className) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;

        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';
        contentDiv.textContent = text;

        messageDiv.appendChild(contentDiv);
        chatWindow.appendChild(messageDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight; // Auto-scroll to bottom
    }

    // --- Event Listeners ---
    sendButton.addEventListener('click', handleChat);
    promptInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            handleChat();
        }
    });

    // --- 4. Font Size Adjustment ---
    document.addEventListener('keydown', (event) => {
        if (event.ctrlKey || event.metaKey) {
            const root = document.documentElement;
            const style = window.getComputedStyle(root);
            const currentSize = parseFloat(style.fontSize);
            let newSize;

            if (event.key === '=' || event.key === '+') {
                event.preventDefault();
                newSize = currentSize + 1;
            } else if (event.key === '-') {
                event.preventDefault();
                newSize = currentSize - 1;
            }

            // Set min and max font size limits
            if (newSize && newSize >= 10 && newSize <= 28) {
                root.style.fontSize = newSize + 'px';
            }
        }
    });

    // --- Initial Load ---
    document.addEventListener('DOMContentLoaded', populateModels);

</script>
</body>
</html>
