        async function handleRegenerateMessage(messageDiv) {
            // Find the user message that prompted this response
            const messageIndex = parseInt(messageDiv.dataset.messageIndex);

            // Remove this AI message and any messages after it
            const messagesToRemove = [];
            let currentMsg = messageDiv;
            while (currentMsg) {
                messagesToRemove.push(currentMsg);
                currentMsg = currentMsg.nextElementSibling;
            }
            messagesToRemove.forEach(msg => msg.remove());

            // Remove from conversation history
            appState.conversationHistory.splice(messageIndex);

            // Get the last user message
            const lastUserMessage = appState.conversationHistory[appState.conversationHistory.length - 1];

            if (!lastUserMessage || lastUserMessage.role !== 'user') {
                showError('Cannot regenerate');
                return;
            }

            // Regenerate response with thinking animation
            showTypingIndicator();
            elements.sendBtn.disabled = true;

            try {
                // Use the same streaming API call
                // Thinking indicator will be hidden when first text arrives
                const data = await callOllamaAPIWithRetry();

                appState.conversationHistory.push(data.message);

                const promptTokens = data.prompt_eval_count || 0;
                const responseTokens = data.eval_count || 0;
                const evalDurationInSeconds = data.eval_duration / 1e9;
                const tokensPerSecond = (evalDurationInSeconds > 0) ? (responseTokens / evalDurationInSeconds).toFixed(2) : 0;

                elements.tokenCounter.textContent = `Prompt: ${promptTokens} | Response: ${responseTokens} | ${tokensPerSecond} tok/s`;
                saveState();

            } catch (error) {
                showError('Failed to regenerate message');
            } finally {
                elements.sendBtn.disabled = false;
            }
        }

        function handleEditTitle() {
            const currentTitle = elements.chatTitle.textContent;

            // Create input field
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'chat-title-edit';
            input.value = currentTitle;

            // Replace title with input
            elements.chatTitle.replaceWith(input);
            input.id = 'chatTitle';
            input.focus();
            input.select();

            // Update reference
            elements.chatTitle = input;

            function saveTitle() {
                const newTitle = input.value.trim();
                if (newTitle) {
                    // Create new title element
                    const newTitle_elem = document.createElement('h1');
                    newTitle_elem.className = 'chat-title';
                    newTitle_elem.id = 'chatTitle';
                    newTitle_elem.style.flex = '1';
                    newTitle_elem.textContent = newTitle;

                    input.replaceWith(newTitle_elem);
                    elements.chatTitle = newTitle_elem;

                    // Add click listener to new title
                    elements.chatTitle.addEventListener('click', handleEditTitle);

                    // Update saved chat if one is currently loaded
                    if (appState.currentLoadedChatId) {
                        const chatIndex = appState.savedChats.findIndex(c => c.id === appState.currentLoadedChatId);
                        if (chatIndex !== -1) {
                            appState.savedChats[chatIndex].title = newTitle;
                            renderSavedChats();
                        }
                    }

                    saveState();
                    showSuccess('Chat renamed');
                } else {
                    // Revert if empty
                    const newTitle_elem = document.createElement('h1');
                    newTitle_elem.className = 'chat-title';
                    newTitle_elem.id = 'chatTitle';
                    newTitle_elem.style.flex = '1';
                    newTitle_elem.textContent = currentTitle;

                    input.replaceWith(newTitle_elem);
                    elements.chatTitle = newTitle_elem;
                    elements.chatTitle.addEventListener('click', handleEditTitle);
                }
            }

            // Save on Enter
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    saveTitle();
                }
                if (e.key === 'Escape') {
                    // Revert on Escape
                    const newTitle_elem = document.createElement('h1');
                    newTitle_elem.className = 'chat-title';
                    newTitle_elem.id = 'chatTitle';
                    newTitle_elem.style.flex = '1';
                    newTitle_elem.textContent = currentTitle;

                    input.replaceWith(newTitle_elem);
                    elements.chatTitle = newTitle_elem;
                    elements.chatTitle.addEventListener('click', handleEditTitle);
                }
            });

            // Save on blur
            input.addEventListener('blur', saveTitle);
        }

        function handleSaveChat() {
            if (appState.conversationHistory.length === 0) {
                showError('No messages to save');
                return;
            }

            const chatTitle = appState.conversationHistory[0]?.content.substring(0, 50) || 'Untitled Chat';
            const chatId = 'chat-' + Date.now();

            const savedChat = {
                id: chatId,
                title: chatTitle,
                messages: [...appState.conversationHistory],
                model: appState.currentModel,
                timestamp: Date.now(),
                systemPrompt: appState.systemPrompt,
                params: {...appState.params}
            };

            // Add to saved chats
            appState.savedChats.unshift(savedChat);
            appState.savedChats = appState.savedChats.slice(0, 50); // Keep max 50 saved chats

            saveState();
            renderSavedChats();
            showSuccess(`Saved: "${chatTitle.substring(0, 30)}"...`);
        }

            const chat = appState.savedChats.find(c => c.id === chatId);

            const newTitle = prompt('Rename chat:', chat.title);
            if (newTitle && newTitle.trim()) {
                chat.title = newTitle.trim();
                saveState();
                renderSavedChats();
                showSuccess('Chat renamed');

            if (confirm('Delete this chat? This cannot be undone.')) {
                appState.savedChats = appState.savedChats.filter(c => c.id !== chatId);

                if (appState.currentLoadedChatId === chatId) {

        }

        function handleExportChat(chat) {
            const content = `Chat: ${chat.title}\nModel: ${chat.model}\nDate: ${new Date(chat.timestamp).toLocaleString()}\n\n${'='.repeat(50)}\n\n${chat.messages.map(msg => `${msg.role.toUpperCase()}: ${msg.content}`).join('\n\n')}`;
            downloadFile(content, `${chat.title.replace(/\s+/g, '_')}.txt`, 'text/plain');
            showSuccess('Chat exported');
        }

        function renderSavedChats() {
            const historyContainer = elements.chatHistory;

            // Keep the "Current Chat" item
            historyContainer.innerHTML = '<div class="chat-item active" id="currentChat">Current Chat</div>';

            // Add saved chats
            appState.savedChats.forEach(chat => {
                const chatItem = document.createElement('div');
                chatItem.className = 'chat-item';
                chatItem.dataset.chatId = chat.id;

                const contentWrapper = document.createElement('div');
                contentWrapper.style.flex = '1';
                contentWrapper.style.minWidth = '0';
                contentWrapper.style.display = 'flex';
                contentWrapper.style.flexDirection = 'column';
                contentWrapper.style.gap = '2px';

                const title = document.createElement('div');
                title.className = 'chat-item-title';
                title.textContent = chat.title;
                title.style.fontWeight = '500';
                title.style.whiteSpace = 'nowrap';
                title.style.overflow = 'hidden';
                title.style.textOverflow = 'ellipsis';

                const meta = document.createElement('div');
                meta.className = 'chat-item-meta';
                meta.style.fontSize = 'var(--font-xs)';
                meta.style.color = 'var(--text-tertiary)';
                const date = new Date(chat.timestamp).toLocaleDateString();
                meta.textContent = `${chat.model} • ${date}`;

                contentWrapper.appendChild(title);
                contentWrapper.appendChild(meta);

                // Action buttons
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'chat-item-actions';

                const renameBtn = document.createElement('button');
                renameBtn.className = 'chat-item-action-btn';
                renameBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>';
                renameBtn.title = 'Rename';
                renameBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleRenameSavedChat(chat.id);
                });

                const exportBtn = document.createElement('button');
                exportBtn.className = 'chat-item-action-btn';
                exportBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>';
                exportBtn.title = 'Export';
                exportBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleExportChat(chat);
                });

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'chat-item-action-btn delete';
                deleteBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>';
                deleteBtn.title = 'Delete';
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleDeleteSavedChat(chat.id);
                });

                actionsDiv.appendChild(renameBtn);
                actionsDiv.appendChild(exportBtn);
                actionsDiv.appendChild(deleteBtn);

                chatItem.appendChild(contentWrapper);
                chatItem.appendChild(actionsDiv);

                chatItem.addEventListener('click', () => loadSavedChat(chat.id));
                historyContainer.appendChild(chatItem);
            });

            
        }

        function loadSavedChat(chatId) {
            const chat = appState.savedChats.find(c => c.id === chatId);
            if (!chat) return;

            appState.conversationHistory = chat.messages;
            appState.currentModel = chat.model;
            appState.systemPrompt = chat.systemPrompt;
            Object.assign(appState.params, chat.params);
            appState.currentLoadedChatId = chatId; // Track which chat is loaded

            elements.modelSelect.value = chat.model;
            elements.systemPromptInput.value = chat.systemPrompt;
            elements.chatMessages.innerHTML = '';
            elements.chatTitle.textContent = `${chat.title.substring(0, 50)}${chat.title.length > 50 ? '...' : ''}`;

            // Restore messages
            chat.messages.forEach(msg => {
                if (msg.role !== 'system') {
                    addMessageToUI(msg.role, msg.content);
                }
            });

            saveState();
            showSuccess('Loaded saved chat');
        }

        function handleNewChat() {
            if (appState.conversationHistory.length > 0) {
                // Ask user if they want to save
                if (confirm('Save this chat before starting a new one?')) {
                    handleSaveChat();
                }
            }

            // Clear the chat
            appState.conversationHistory = [];
            appState.currentLoadedChatId = null;
            elements.chatMessages.innerHTML = '';
            elements.chatTitle.textContent = 'Charlie Llama Chat';
            elements.tokenCounter.textContent = 'Ready';
            saveState();
        }

        function handleClearChat() {
            // Clear chat without asking to save
            if (appState.conversationHistory.length > 0) {
                if (confirm('Clear this chat? This cannot be undone.')) {
                    appState.conversationHistory = [];
                    appState.currentLoadedChatId = null;
                    elements.chatMessages.innerHTML = '';
                    elements.chatTitle.textContent = 'Charlie Llama Chat';
                    elements.tokenCounter.textContent = 'Ready';
                    saveState();
                }
            }
        }

        // ============================================ 
        // SYSTEM PROMPT
        // ============================================ 

        function toggleSystemPrompt() {
            elements.systemPromptToggle.classList.toggle('active');
            elements.systemPromptEditor.classList.toggle('active');
        }

        function applySystemPrompt() {
            appState.systemPrompt = elements.systemPromptInput.value;
            saveState();
            toggleSystemPrompt();
            showSuccess('System prompt updated');
        }

        function resetSystemPrompt() {
            const defaultPrompt = 'You are a helpful assistant.';
            elements.systemPromptInput.value = defaultPrompt;
            appState.systemPrompt = defaultPrompt;
            elements.promptTemplate.value = '';
            saveState();
            showSuccess('System prompt reset');
        }

        function handleTemplateSelection(e) {
            const templateKey = e.target.value;
            if (templateKey && promptTemplates[templateKey]) {
                elements.systemPromptInput.value = promptTemplates[templateKey];
                showSuccess(`Template loaded: ${e.target.options[e.target.selectedIndex].text}`);
            }
        }

        // ============================================ 
        // SETTINGS & PARAMETERS
        // ============================================ 

        function setupParameterSliders() {
            const sliders = document.querySelectorAll('.param-slider');

            sliders.forEach(slider => {
                slider.addEventListener('input', (e) => {
                    const param = e.target.id;
                    const value = parseFloat(e.target.value);

                    // Update display
                    if (param === 'font_size') {
                        document.getElementById('fontSizeValue').textContent = value + 'px';
                        // Only affect message text, not entire UI
                        const style = document.getElementById('messageFontStyle') || document.createElement('style');
                        if (!document.getElementById('messageFontStyle')) {
                            style.id = 'messageFontStyle';
                            document.head.appendChild(style);
                        }
                        style.textContent = `.message-text { font-size: ${value}px !important; }`;
                    } else if (param === 'temperature') {
                        document.getElementById('tempValue').textContent = value;
                        appState.params.temperature = parseFloat(value);
                    } else if (param === 'top_p') {
                        document.getElementById('topPValue').textContent = value;
                        appState.params.top_p = parseFloat(value);
                    } else if (param === 'num_predict') {
                        document.getElementById('maxTokensValue').textContent = parseInt(value).toLocaleString();
                        appState.params.num_predict = parseInt(value);
                    } else if (param === 'repeat_penalty') {
                        document.getElementById('repeatPenaltyValue').textContent = value;
                        appState.params.repeat_penalty = parseFloat(value);
                    }

                    saveState();
                });
            });
        }

        function openSettings() {
            elements.settingsModal.classList.add('active');
        }

        function closeSettings() {
            elements.settingsModal.classList.remove('active');
        }

        function closeExportMenu() {
            // Placeholder for export menu close
        }

        // ============================================
        // EXPORT FUNCTIONS
        // ============================================ 

        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

                // ============================================
                // THEME
                // ============================================
        
                function setTheme(theme) {
                    document.body.setAttribute('data-theme', theme);
                    appState.theme = theme;
                    elements.themeSelect.value = theme;

                    // Update Safari/browser theme color (title bar color)
                    const themeColors = {
                        'light': '#F8F9FA',
                        'dark': '#2A2A2A',
                        'retro-light': '#0A0E27',
                        'retro-dark': '#000000'
                    };

                    const metaThemeColor = document.querySelector('meta[name="theme-color"]');
                    if (metaThemeColor) {
                        metaThemeColor.setAttribute('content', themeColors[theme] || '#0A0E27');
                    }

                    saveState();
                }

                function toggleDarkLightMode() {
                    // Toggle between light/dark pairs
                    const currentTheme = appState.theme;
                    let newTheme;

                    if (currentTheme === 'light') {
                        newTheme = 'dark';
                    } else if (currentTheme === 'dark') {
                        newTheme = 'light';
                    } else if (currentTheme === 'retro-light') {
                        newTheme = 'retro-dark';
                    } else if (currentTheme === 'retro-dark') {
                        newTheme = 'retro-light';
                    } else {
                        // Default fallback
                        newTheme = 'retro-light';
                    }

                    setTheme(newTheme);
                }

                function toggleSidebar() {
                    appState.sidebarOpen = !appState.sidebarOpen;

                    if (appState.sidebarOpen) {
                        elements.sidebar.classList.remove('collapsed');
                        elements.container.classList.remove('sidebar-closed');
                    } else {
                        elements.sidebar.classList.add('collapsed');
                        elements.container.classList.add('sidebar-closed');
                    }

                    saveState();
                }

                // ============================================
        // UTILITIES
        // ============================================ 

        function autoResizeTextarea() {
            elements.chatInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 200) + 'px';
            });
        }

        function showSuccess(message) {
            showNotification(message, 'success');
        }

        function showError(message) {
            showNotification(message, 'error');
        }

        function showNotification(message, type = 'info') {
            const badge = elements.statusBadge;
            const originalText = badge.textContent;
            const originalClass = badge.className;

            badge.textContent = message;
            badge.className = `badge badge-${type}`;

            setTimeout(() => {
                badge.textContent = originalText;
                badge.className = originalClass;
            }, 3000);
        }

        // ============================================ 
        // STATE PERSISTENCE
        // ============================================ 

        function saveState() {
            try {
                localStorage.setItem('ollama-enhanced-state', JSON.stringify(appState));
            } catch (error) {
                console.error('Failed to save state:', error);
            }
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('ollama-enhanced-state');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    Object.assign(appState, parsed);

                    // Restore UI state
                    document.body.setAttribute('data-theme', appState.theme);
                    elements.systemPromptInput.value = appState.systemPrompt;

                    setTheme(appState.theme);

                    // Restore parameters
                    Object.keys(appState.params).forEach(key => {
                        const slider = document.getElementById(key);
                        if (slider) {
                            slider.value = appState.params[key];
                        }
                    });

                    // Restore font size for message text
                    const fontSizeSlider = document.getElementById('font_size');
                    if (fontSizeSlider) {
                        const fontSize = fontSizeSlider.value;
                        const style = document.createElement('style');
                        style.id = 'messageFontStyle';
                        style.textContent = `.message-text { font-size: ${fontSize}px !important; }`;
                        document.head.appendChild(style);
                    }

                    // Restore sidebar state
                    if (!appState.sidebarOpen) {
                        elements.sidebar.classList.add('collapsed');
                        elements.container.classList.add('sidebar-closed');
                    }

                    

                    // Restore messages
                    appState.conversationHistory.forEach(msg => {
                        if (msg.role !== 'system') {
                            addMessageToUI(msg.role, msg.content);
                        }
                    });

                    // Render saved chats in sidebar
                    renderSavedChats();

                    // Re-attach click listener to chat title
                    if (elements.chatTitle) {
                        elements.chatTitle.addEventListener('click', handleEditTitle);
                    }
                }
            } catch (error) {
                console.error('Failed to load state:', error);
            }
        }

        // ============================================ 
        // KEYBOARD SHORTCUTS
        // ============================================ 

        function handleKeyboardShortcuts(e) {
            // Ctrl/Cmd + K = Focus input
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                elements.chatInput.focus();
            }

            // Ctrl/Cmd + N = New chat
            if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                e.preventDefault();
                handleNewChat();
            }

            // Ctrl/Cmd + , = Open settings
            if ((e.ctrlKey || e.metaKey) && e.key === ',') {
                e.preventDefault();
                openSettings();
            }

            // Escape = Close modals
            if (e.key === 'Escape') {
                closeSettings();
                closeExportMenu();
            }

            // Ctrl/Cmd + = or + to increase font size (message text only)
            if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) {
                e.preventDefault();
                const fontSizeSlider = document.getElementById('font_size');
                const currentSize = parseFloat(fontSizeSlider.value);
                const newSize = Math.min(currentSize + 1, 20);
                fontSizeSlider.value = newSize;
                fontSizeSlider.dispatchEvent(new Event('input'));
            }

            // Ctrl/Cmd + - to decrease font size (message text only)
            if ((e.ctrlKey || e.metaKey) && e.key === '-') {
                e.preventDefault();
                const fontSizeSlider = document.getElementById('font_size');
                const currentSize = parseFloat(fontSizeSlider.value);
                const newSize = Math.max(currentSize - 1, 12);
                fontSizeSlider.value = newSize;
                fontSizeSlider.dispatchEvent(new Event('input'));
            }
        }

        // ============================================ 
        // START APP
        // ============================================ 

        document.addEventListener('DOMContentLoaded', init);

    </script>
